* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #E9E1CE; color: #2B1D1A; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.45; }
.px { font-family: "Pixelify Sans", ui-monospace, monospace; }
.num, .tC .story, .tC .coin { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.tC .num { font-weight: 600; font-size: 13px; }
.spr { image-rendering: pixelated; flex: none; display: block; }

/* ---------- kerangka halaman ---------- */
.bar { position: sticky; top: 0; z-index: 5; background: #FFFBF0; border-bottom: 1px solid #D9CBA8; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar h1 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; white-space: nowrap; }
.tabs { display: flex; gap: 6px; }
.tabs button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid #D9CBA8; border-radius: 6px; background: #FFFFFF; color: #2B1D1A; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: #2B1D1A; border-color: #2B1D1A; color: #FFF8E6; font-weight: 600; }
.intro { max-width: 820px; margin: 0 auto; padding: 12px 12px 0; }
.intro h2 { margin: 0 0 2px; font-size: 15px; }
.intro p { margin: 0; font-size: 13px; color: #5B4B3A; }
.stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 12px 12px 8px; }
.stage figure { margin: 0; }
.stage figcaption { font-size: 12px; color: #5B4B3A; margin-bottom: 6px; }
.fit { position: relative; }
.note { max-width: 820px; margin: 0 auto; padding: 4px 12px 28px; font-size: 12px; color: #5B4B3A; }

/* ---------- layar HP: dasar bersama ---------- */
.phone { width: 390px; height: 844px; position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; color: #2B1D1A; font-size: 14px; line-height: 1.45; outline: 1px solid #CDBE9B; }
.scr { position: absolute; inset: 0 0 64px 0; overflow: auto; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.scr.game { inset: 0; padding: 12px 14px; gap: 8px; }
.row { display: flex; align-items: center; }
.rowb { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g4 { gap: 4px; } .g6 { gap: 6px; } .g8 { gap: 8px; } .g10 { gap: 10px; }
.mut { color: var(--mut); }
.f11 { font-size: 11px; } .f12 { font-size: 12px; } .f13 { font-size: 13px; }
.b { font-weight: 600; }
.sub { font-size: 12px; color: var(--mut); }
.h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
.sec { font-size: 12px; color: var(--mut); margin-bottom: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.pad8 { padding: 8px 12px; } .pad12 { padding: 12px; }
.list > div { padding: 10px 12px; border-bottom: 1px solid var(--line2); }
.list > div:last-child { border-bottom: 0; }
.btn { text-align: center; padding: 8px; border-radius: 6px; font-weight: 600; }
.btn.pri { background: var(--pri); color: var(--priText); }
.chip { font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
.ibtn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--mut); font-weight: 700; flex: none; }
.dot { display: block; width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.lv { display: inline-block; white-space: nowrap; font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--mut); background: var(--card); }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; border-top: 1px solid var(--line); background: var(--card); }
.nav div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--mut); }
.nav div.on { color: var(--priDark); font-weight: 700; }
.coin { width: 33px; height: 33px; display: flex; align-items: center; justify-content: center; background: var(--coin) center / 33px 33px no-repeat; color: #4A2C12; font-size: 14px; font-weight: 700; flex: none; }
.coins9 { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; justify-items: center; }
.tray { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 34px; }
.small { padding: 6px 14px; font-size: 13px; }

/* ---------- A dan B: hangat, bentuk seperti sekarang ---------- */
.tB { --card: #FFFFFF; --line: #2B1D1A; --line2: #E4E4DC; --mut: #4B4B57; --pri: #FFC83D; --priDark: #1F6FC9; --priText: #2B1D1A; background: #8FD3F5 top center / 390px 844px no-repeat; image-rendering: pixelated; }
.tB.pHome { background-image: var(--bgHome); }
.tB.pGame { background-image: var(--bgGame); }
.tB .card { border-width: 2px; border-radius: 8px; box-shadow: 0 3px 0 rgba(43, 29, 26, .3); }
.tB .list > div { border-bottom-width: 1px; }
.tB .chip, .tB .ibtn { border-width: 2px; color: #2B1D1A; font-weight: 600; }
.tB .btn.pri { border: 2px solid #2B1D1A; box-shadow: inset 0 -3px 0 #E39A1C, inset 0 2px 0 #FFE38A; padding-bottom: 10px; }
.tB .btn.pri.small { padding: 6px 16px 9px; }
.tB .sec { display: inline-block; background: #FFFFFF; border: 2px solid #2B1D1A; border-radius: 6px; padding: 0 7px; color: #2B1D1A; font-weight: 600; }
.tB .dot { background: #D3D3CB; }
.tB .nav { border-top-width: 2px; }
.tB .coin { filter: drop-shadow(0 2px 0 rgba(43, 29, 26, .25)); }
.tA { --card: #FFFBF0; --line: #D9CBA8; --line2: #EBE1C8; --mut: #6B5B45; --pri: #3A7A36; --priDark: #2E662B; --priText: #FFFFFF; background: #F5EEDC; }

/* B: peta desa */
.map { position: relative; width: 358px; height: 300px; border: 2px solid #2B1D1A; border-radius: 6px; overflow: hidden; flex: none; }
.map img { display: block; width: 358px; height: 300px; image-rendering: pixelated; }
.sign { position: absolute; transform: translateX(-50%); border: 6px solid transparent; border-image: var(--fPanel) 30 fill / 6px; padding: 0 2px; font-size: 12px; line-height: 1.2; white-space: nowrap; text-align: center; }
.sign small { font-family: Inter, system-ui, sans-serif; font-size: 11px; color: #6B5B45; margin-left: 4px; }

/* ---------- C: pixel penuh ---------- */
.tC { --card: #FFF6DC; --line: #2B1D1A; --line2: #E0CC9C; --mut: #5E4A36; --pri: #F2C035; --priDark: #FFE680; --priText: #2B1D1A; background: #DCC594; font-family: "Pixelify Sans", ui-monospace, monospace; font-size: 15px; }
.tC .scr { gap: 15px; }
.tC .scr.game { gap: 13px; }
.tC .card { border: 6px solid transparent; border-radius: 0; background: none; border-image: var(--fPanel) 30 fill / 6px; }
.tC .chip, .tC .ibtn { border: 6px solid transparent; border-radius: 0; background: none; border-image: var(--fWood) 30 fill / 6px; color: #2B1D1A; padding: 0 3px; }
.tC .lv { border: 0; border-radius: 0; margin-left: 4px; padding: 0 6px 1px; box-shadow: 0 -2px 0 #2B1D1A, 0 2px 0 #2B1D1A, -2px 0 0 #2B1D1A, 2px 0 0 #2B1D1A, inset 0 -2px 0 #E6D3A3; }
.tC .btn.pri { border: 6px solid transparent; border-radius: 0; background: none; border-image: var(--fGold) 30 fill / 6px; padding: 4px 10px 5px; font-weight: 700; }
.tC .hd { background: #8A5A32; color: #FFF6DC; margin: -16px -16px 0; padding: 12px 16px; border-bottom: 2px solid #2B1D1A; box-shadow: inset 0 -4px 0 #5E3B20, inset 0 2px 0 #B9814A; }
.tC .scr.game .hd { margin: -12px -14px 0; padding: 10px 14px 12px; }
.tC .hd .sub { color: #F0D9A8; }
.tC .sub, .tC .f12 { font-size: 13px; } .tC .f11 { font-size: 12px; } .tC .sec { font-size: 13px; margin-bottom: 8px; color: #2B1D1A; }
.tC .dot { border-radius: 0; height: 8px; background: #C9B487; box-shadow: 0 0 0 1px #2B1D1A; margin-left: 3px; }
.tC .nav { background: #8A5A32; border-top: 2px solid #2B1D1A; box-shadow: inset 0 3px 0 #B9814A; }
.tC .nav div { color: #F0D9A8; font-size: 12px; }

  h += '<div class="rowb hd"><div><div class="sub">Fundamental Math</div><div class="h1 px">Halo, Faiq</div></div>' +
    '<div class="row g8"><div class="chip">Mulai hari ini</div><div class="ibtn">' + (C ? ic('gir', 1.5) : GEAR) + '</div></div></div>';
  var target = '<div class="card rowb pad8"><div class="f13"><span class="mut">Target hari ini</span> · <span class="b num">0/2</span></div><div class="row g4"><i class="dot"></i><i class="dot"></i></div></div>';
  var welcome = '<div class="card pad12"><div class="sub">Selamat datang, peneliti</div><div class="b">Belum ada kasus yang dimainkan</div>' +
    '<div class="f13 mut">Pilih satu game di Mini Games. Semua temuanmu akan tercatat di sini.</div><div class="btn pri" style="margin-top: 10px">Buka Mini Games</div></div>';
  var rec = '<div><div class="sec">Coba berikutnya</div><div class="card rowb" style="padding: 10px 12px"><div class="row g10">' + (B ? '' : ic('coin2', 2)) +
    '<div><div class="b">Kasir Kilat · Fundamental</div><div class="f12 mut">Game yang belum pernah kamu coba.</div></div></div><span class="mut">' + NEXT + '</span></div></div>';
  var badge = '<div class="card rowb pad8"><div class="row g8 f13">' + ic('peti', 2) + '<div><span class="mut">Lencana</span> · <span class="b">Belum ada</span></div></div><div class="f12 b" style="color: #2E662B">Lihat semua</div></div>';
  function item(icon, a, b, c) { return '<div class="rowb"><div class="row g10">' + ic(icon, 2) + '<div><div class="b">' + a + '</div><div class="f12 mut">' + b + '</div></div></div><div class="f12 mut">' + c + '</div></div>'; }

  if (B) {
    var signs = [[31, 59, 'Bilangan', '0/7'], [89, 59, 'Aljabar', '0/9'], [147, 59, 'Geometri', '0/6'], [31, 129, 'Data', '0/5'], [89, 129, 'Tantangan', '–'], [147, 129, 'Bengkel', '0']];
    h += '<div class="map"><img alt="Peta desa: empat bangunan materi, papan tantangan, dan gudang bengkel" src="' + mapURL() + '">' +
      signs.map(function (s) { return '<div class="sign px" style="left: ' + s[0] * 2 + 'px; top: ' + s[1] * 2 + 'px"><b>' + s[2] + '</b><small>' + s[3] + '</small></div>'; }).join('') + '</div>';
    h += target + welcome + rec;
    h += '<div class="card rowb" style="padding: 10px 12px"><div class="row g10">' + ic('kaca', 2) + '<div><div class="b">Cek celah</div><div class="f12 mut">Saran tingkat dari progresmu</div></div></div><div class="f12 mut">Bilangan</div></div>';
    h += badge;
  } else {
    h += target + welcome;
    h += '<div><div class="sec">Hari ini</div><div class="card list">' +
      item('bendera', 'Tantangan harian', 'Mainkan satu game dulu', '–') +
      item('palu', 'Bengkel kesalahan', 'Kasus yang pernah gagal muncul lagi', '<span class="lv"><span class="num">0</span> kasus</span>') +
      item('kaca', 'Cek celah', 'Saran tingkat dari progresmu', 'Bilangan') + '</div></div>';
    h += rec;
    h += '<div><div class="sec">Materi · bintang ★1 per tingkat</div><div class="card list">' + MATS.map(function (m) {
      return '<div class="rowb" style="padding: 7px 12px"><div>' + m[0] + '<span class="f12 mut num" style="margin-left: 6px">' + m[1] + '</span></div><div class="row g4"><span class="lv">F</span><span class="lv">I</span><span class="lv">E</span></div></div>';
    }).join('') + '</div></div>';
    h += badge;
  }
  return '<div class="scr">' + h + '</div>' + nav();
}
function game(t) {
  var C = t === 'C', B = t === 'B', h = '', i, box = '';
  h += '<div class="row g8 hd"><div class="ibtn" style="width: 30px; height: 30px; color: inherit">' + BACK + '</div><div class="b px" style="flex: 1; font-size: 17px">Kasir Kilat</div>' +
    '<div class="ibtn" style="width: 30px; height: 30px">?</div><div class="chip" style="padding: 5px 9px">Misi</div></div>';
  h += '<div class="card" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 6px"><div class="rowb"><span class="f11 mut">Misi <span class="num">1</span></span>' + (C ? ic('roti', 2) : '') + '</div>' +
    '<div class="story" style="font-size: ' + (C ? 14 : 13) + 'px">Pelanggan pertamamu membeli roti seharga 37 ribu dan membayar 50 ribu.</div>' +
    '<div class="b story" style="font-size: ' + (C ? 14 : 13) + 'px">Siapkan kembalian yang pas. Kamu hanya boleh menyerahkan 2 kali.</div></div>';
  h += '<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 8px"><div class="rowb f11"><span class="mut">Nampan kembalian</span><span><span class="mut">Kesempatan menyerahkan</span> <span class="b num">2 / 2</span></span></div>' +
    '<div class="tray"><div class="coin">5</div><div class="coin">2</div></div></div>';
  for (i = 1; i <= 9; i++) box += '<div class="coin">' + i + '</div>';
  h += '<div class="card" style="padding: 8px 10px; display: flex; flex-direction: column; gap: 6px"><span class="f11 mut">Kotak koin (ribu)</span><div class="coins9">' + box + '</div></div>';
  h += '<div class="row" style="justify-content: flex-end"><div class="btn pri small">Serahkan</div></div>';
  return '<div class="scr game">' + h + '</div>';
}

/* ---------- pemilih tema ---------- */
var INFO = {
  A: ['A. Sentuhan pixel', 'Tata letak persis seperti sekarang. Yang berubah: warna hangat, huruf pixel hanya di judul, dan ikon benda pixel kecil. Paling tenang dan paling mudah dibaca.'],
  B: ['B. Desa pixel (dipilih Faiq)', 'Beranda menjadi peta desa: tiap materi sebuah bangunan, tantangan di papan pengumuman, bengkel di gudang. Latar layar berupa gambar pixel (langit, awan, rumput), bukan warna cokelat. Kartu putih bergaris tegas supaya teks tetap mudah dibaca.'],
  C: ['C. Pixel penuh', 'Semua panel, tombol, label, dan koin bergaya pixel dan kayu. Cerita soal dan angka tetap memakai huruf biasa supaya tidak salah baca. Paling terasa seperti game, tetapi paling ramai.']
};
function show(t) {
  if (!INFO[t]) t = 'B';
  document.getElementById('tname').textContent = INFO[t][0];
  document.getElementById('tdesc').textContent = INFO[t][1];
  [['pHome', home], ['pGame', game]].forEach(function (p) { var el = document.getElementById(p[0]); el.className = 'phone t' + t + ' ' + p[0]; el.innerHTML = p[1](t); });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-t') === t ? 'true' : 'false'); });
}
function fit() {
  var s = Math.min(1, (document.documentElement.clientWidth - 24) / 390);
  Array.prototype.forEach.call(document.querySelectorAll('.fit'), function (f) { f.style.width = 390 * s + 'px'; f.style.height = 844 * s + 'px'; f.firstElementChild.style.transform = 'scale(' + s + ')'; });
}
function fromHash() { var m = /^#tema-([abc])$/.exec(location.hash); return m ? m[1].toUpperCase() : 'B'; }
document.documentElement.style.setProperty('--bgHome', 'url("' + bgURL('home') + '")'); document.documentElement.style.setProperty('--bgGame', 'url("' + bgURL('game') + '")');
['coin', 'fPanel', 'fWood', 'fGold'].forEach(function (n) { document.documentElement.style.setProperty('--' + n, 'url("' + uri(n) + '")'); });
document.getElementById('tabs').addEventListener('click', function (e) { var t = e.target.getAttribute('data-t'); if (!t) return; show(t); try { history.replaceState(null, '', '#tema-' + t.toLowerCase()); } catch (err) { location.hash = 'tema-' + t.toLowerCase(); } });
window.addEventListener('hashchange', function () { show(fromHash()); });
window.addEventListener('resize', fit);
show(fromHash()); fit();
</script>
</body>
</html>
